name: TEMP CrownThrive OS Repository Rebrand
on:
  push:
    branches: [main]
    paths: ['.github/workflows/crownthrive-os-rebrand-temp.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Force canonical repository identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          old='CrownThrive-'+'Support'; pattern=re.compile(re.escape(old),re.IGNORECASE); changed=[]
          for f in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not f or f.startswith('.github/workflows/'): continue
              p=Path(f)
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              new,n=pattern.subn('CrownThrive-OS',text)
              if n: p.write_text(new,encoding='utf-8'); changed.append((f,n))
          print(f'files={len(changed)} refs={sum(n for _,n in changed)}')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'CrownThrive OS Automation'
          git config user.email 'contact@crownthrive.com'
          git add -u && git commit -m 'chore(os): migrate repository references to CrownThrive-OS'
          git push origin HEAD:main
